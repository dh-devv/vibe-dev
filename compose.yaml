services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vibe_dev
      POSTGRES_USER: vibe_dev
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 데이터 볼륨이 비어 있을 때 첫 기동에만 실행된다
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibe_dev -d vibe_dev"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://vibe_dev:local-dev-only@postgres:5432/vibe_dev
      # 인증(OIDC) 전까지 로컬 개발용 소유자를 쓴다. 배포에서는 켜지 않는다
      DEV_AUTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

volumes:
  postgres_data: